{% extends "base.html" %}

{% block title %}供应商管理{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-sm border p-6">
    <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-semibold flex items-center gap-2">
            <i class="fas fa-truck text-blue-600"></i> 供应商列表
        </h3>
        <button onclick="document.getElementById('addModal').classList.remove('hidden')" 
                class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <i class="fas fa-plus"></i> 添加供应商
        </button>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="border-b text-left text-sm text-gray-500">
                    <th class="py-3 px-4">供应商名称</th>
                    <th class="py-3 px-4">地址</th>
                    <th class="py-3 px-4">生产许可证号</th>
                    <th class="py-3 px-4">添加时间</th>
                </tr>
            </thead>
            <tbody class="divide-y">
                {% for s in suppliers %}
                <tr class="hover:bg-gray-50">
                    <td class="py-3 px-4 font-medium">{{ s.name }}</td>
                    <td class="py-3 px-4 text-gray-600">{{ s.address or '-' }}</td>
                    <td class="py-3 px-4 font-mono text-sm">{{ s.license_no or '-' }}</td>
                    <td class="py-3 px-4 text-sm text-gray-500">{{ s.created_at.strftime('%Y-%m-%d') }}</td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="py-8 text-center text-gray-400">暂无供应商，请添加</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- 添加供应商弹窗 -->
<div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl w-full max-w-md p-6">
        <h3 class="text-xl font-semibold mb-4">添加新供应商</h3>
        <form action="/suppliers/add" method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">供应商名称 <span class="text-red-500">*</span></label>
                    <input type="text" name="name" required class="w-full border rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">地址</label>
                    <input type="text" name="address" class="w-full border rounded-xl px-4 py-2.5">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">生产许可证号</label>
                    <input type="text" name="license_no" class="w-full border rounded-xl px-4 py-2.5 font-mono">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')" 
                        class="flex-1 py-3 rounded-xl border">取消</button>
                <button type="submit" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-medium">确认添加</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
